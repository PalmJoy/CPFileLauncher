# リリース: cpclipboard-v<Version> のタグ push で両 OS のテスト → zip → 下書きの Release（SPEC §10.4「リリース」）。
# 注釈付きタグに Release-Publish: true がある場合はテスト・ビルド後に公開する。
# 注釈付きタグに Release-Replace-Assets: true がある場合だけ公開済みアセットの再公開を許可する。
# 手動実行（workflow_dispatch）は試運転で、zip を Artifact に置くだけ（Release は作らない）。
# ビルドオプションは CPClipboard/src/build/publish-*.{ps1,sh} に一元化する。ここに dotnet publish を書かない
name: release-CPClipboard

on:
  push:
    tags: ['cpclipboard-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-clipboard-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # SharpHook 8.0.0 が取り込む libuiohook（LGPL-3.0）のコミット。THIRD-PARTY-NOTICES.txt と同じ値（ThirdPartyNoticesTests が照合）
  LIBUIOHOOK_COMMIT: a41658fb2bef7503a3bcb305ab8bf849755fe906

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      replace-assets: ${{ steps.v.outputs.replace-assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: 配布サイトの動作テスト
        run: node --test CPClipboard/src/build/site.test.mjs
      - id: v
        name: タグと csproj の <Version> の一致
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' CPClipboard/src/CPClipboard.Desktop/CPClipboard.Desktop.csproj | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "csproj の <Version>: $VERSION"
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "replace-assets=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^cpclipboard-v[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "cpclipboard-v$VERSION" ]]; then
              echo "::error::タグ $GITHUB_REF_NAME と csproj の <Version> $VERSION が一致しません（タグは cpclipboard-v<Version>）"
              exit 1
            fi
            if [[ "$(git cat-file -t "$GITHUB_REF")" == "tag" ]] &&
              git for-each-ref --format='%(contents)' "$GITHUB_REF" | grep -Fxq 'Release-Publish: true'; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$(git cat-file -t "$GITHUB_REF")" == "tag" ]] &&
              git for-each-ref --format='%(contents)' "$GITHUB_REF" | grep -Fxq 'Release-Replace-Assets: true'; then
              echo "replace-assets=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: テスト
        run: dotnet test CPClipboard/src/CPClipboard.sln -c Release
      - name: publish + zip（win-x64 / win-arm64）
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File CPClipboard\src\build\publish-win.ps1 -Zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zip-windows
          path: CPClipboard/bin/release/*.zip
          retention-days: 7
          if-no-files-found: error

  build-macos:
    needs: check-version
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: 署名IDの選択テスト
        run: node --test CPClipboard/src/build/mac-signing.test.mjs
      - name: テスト
        run: dotnet test CPClipboard/src/CPClipboard.sln -c Release
      - name: publish + zip（osx-arm64、ad-hoc 署名）
        env:
          CODESIGN_IDENTITY: '-'
        run: zsh CPClipboard/src/build/publish-mac.sh --zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zip-macos
          path: CPClipboard/bin/release/*.zip
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [check-version, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/CPClipboard-*.zip
      - name: libuiohook のソース（LGPL のソース提供）
        run: curl -fsSL -o dist/libuiohook-source.zip "https://github.com/TolikPylypchuk/libuiohook/archive/${LIBUIOHOOK_COMMIT}.zip"
      - name: SHA256SUMS.txt
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: 下書きの Release を作る（同じタグの Release があればアセットを差し替える）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PUBLISH_RELEASE: ${{ needs.check-version.outputs.publish }}
          REPLACE_ASSETS: ${{ needs.check-version.outputs.replace-assets }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "true" && "$REPLACE_ASSETS" != "true" ]]; then
              echo "::error::Published release assets cannot be replaced without explicit Release-Replace-Assets: true tag annotation."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* --repo "$REPO" --draft --latest=false --verify-tag \
              --title "CPClipboard $TAG" --generate-notes \
              --notes "First launch / 初回の起動: https://palmjoy.github.io/CPFileLauncher/CPClipboard/#setup"
          fi
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest=false
          fi
