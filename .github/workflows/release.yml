# リリース: v<Version> のタグ push で両 OS のテスト → zip → 下書きの Release（SPEC §10.4「リリース」）。
# 手動実行（workflow_dispatch）は試運転で、zip を Artifact に置くだけ（Release は作らない）。
# ビルドオプションは src/build/publish-*.{ps1,sh} に一元化する。ここに dotnet publish を書かない
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # SharpHook 8.0.0 が取り込む libuiohook（LGPL-3.0）のコミット。THIRD-PARTY-NOTICES.txt と同じ値（ThirdPartyNoticesTests が照合）
  LIBUIOHOOK_COMMIT: a41658fb2bef7503a3bcb305ab8bf849755fe906

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: タグと csproj の <Version> の一致
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/FileLauncher.Desktop/FileLauncher.Desktop.csproj | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "csproj の <Version>: $VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::タグ $GITHUB_REF_NAME と csproj の <Version> $VERSION が一致しません（タグは v<Version>）"
              exit 1
            fi
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: テスト
        run: dotnet test src/FileLauncher.sln -c Release
      - name: publish + zip（win-x64 / win-arm64）
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src\build\publish-win.ps1 -Zip
      - uses: actions/upload-artifact@v7
        with:
          name: zip-windows
          path: bin/release/*.zip
          retention-days: 7
          if-no-files-found: error

  build-macos:
    needs: check-version
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: テスト
        run: dotnet test src/FileLauncher.sln -c Release
      - name: publish + zip（osx-arm64、ad-hoc 署名）
        env:
          CODESIGN_IDENTITY: '-'
        run: zsh src/build/publish-mac.sh --zip
      - uses: actions/upload-artifact@v7
        with:
          name: zip-macos
          path: bin/release/*.zip
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: libuiohook のソース（LGPL のソース提供）
        run: curl -fsSL -o dist/libuiohook-source.zip "https://github.com/TolikPylypchuk/libuiohook/archive/${LIBUIOHOOK_COMMIT}.zip"
      - name: SHA256SUMS.txt
        working-directory: dist
        run: sha256sum CPFileLauncher-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 下書きの Release を作る（同じタグの Release があればアセットを差し替える）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag \
              --title "CPFileLauncher $TAG" --generate-notes \
              --notes "First launch / 初回の起動: https://palmjoy.github.io/CPFileLauncher/#setup"
          fi
